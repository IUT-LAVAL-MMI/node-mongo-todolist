services:
  mytodolist-mongo:
    image: mongo:8.2.2
    env_file: ".env"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PWD}
    volumes:
      - ./dbDataSample:/docker-entrypoint-initdb.d:ro
      - mongovolume:/data/db
    ports:
      - 27017:27017
    restart: always
volumes:
  mongovolume:
